name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install jj
        run: |
          set -euo pipefail
          mkdir -p /tmp/jj-install
          archive=jj-v0.39.0-x86_64-unknown-linux-musl.tar.gz
          base_url=https://github.com/jj-vcs/jj/releases/download/v0.39.0
          expected_sha256=$(curl -LsSf https://api.github.com/repos/jj-vcs/jj/releases/tags/v0.39.0 | jq -r ".assets[] | select(.name == \"${archive}\") | .digest" | sed 's/^sha256://')
          test -n "${expected_sha256}"
          curl --proto '=https' --tlsv1.2 -LsSf -o /tmp/jj-install/${archive} ${base_url}/${archive}
          echo "${expected_sha256}  /tmp/jj-install/${archive}" | sha256sum -c -
          tar -xzf /tmp/jj-install/${archive} -C /tmp/jj-install
          install /tmp/jj-install/jj /usr/local/bin/jj
      - name: Check lockfile
        run: cargo check
      - name: Test
        run: cargo test

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build --locked
      - name: Smoke help output
        run: cargo run -- --help
