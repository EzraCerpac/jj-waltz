name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/herdr -> target
      - name: Format check
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path plugins/herdr/Cargo.toml --all --check
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path plugins/herdr/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    name: test (jj ${{ matrix.jj_version }})
    strategy:
      fail-fast: false
      matrix:
        jj_version: ["0.39.0", "0.44.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install jj
        env:
          JJ_VERSION: ${{ matrix.jj_version }}
        run: |
          mkdir -p /tmp/jj-install
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzf - -C /tmp/jj-install
          install /tmp/jj-install/jj /usr/local/bin/jj
          jj --version
      - name: Check lockfile
        run: cargo check --locked
      - name: Test
        run: cargo test --locked

  herdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/herdr -> target
      - name: Check lockfile
        run: cargo check --locked --manifest-path plugins/herdr/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path plugins/herdr/Cargo.toml
      - name: Build
        run: cargo build --locked --manifest-path plugins/herdr/Cargo.toml

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
